<style>
:root {
  --bg: #12063f;
  --card: #1f1166;
  --field: #150a4d;
  --line: #3a2a9a;
  --text: #ffffff;
  --muted: #bdb5ff;
  --cyan: #5fd9f5;
  --primary: #5b3df5;
  --primary-hover: #6e54ff;
  --danger: #ff8aa8;
  --ok: #5fe3a1;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(120% 80% at 50% 0%, #2a1790 0%, var(--bg) 60%);
  background-color: var(--bg);
  color: var(--text);
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}

.page {
  max-width: 440px;
  margin: 0 auto;
  padding: 16px 16px 24px;
  display: grid;
  gap: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 28px;
  padding: 24px 20px;
}

.card:first-child { text-align: center; }

.mascot { display: block; margin: 0 auto 4px; width: 84px; height: 84px; }
.mascot[hidden] { display: none; }

.brand {
  margin: 4px 0 0;
  color: var(--cyan);
  font-weight: 800;
  font-size: 1.35rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.tagline { margin: 0 0 16px; color: var(--muted); font-size: 0.9rem; }
.name { margin: 0; font-size: 1.25rem; }
.role { margin: 2px 0 18px; color: var(--muted); font-size: 0.9rem; }

.actions {
  list-style: none;
  margin: 0 0 18px;
  padding: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}

.action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 6px 0;
  color: var(--text);
  font-size: 0.8rem;
  font-weight: 600;
  text-decoration: none;
}

.action-icon {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border: 2px solid var(--cyan);
  border-radius: 50%;
  background: var(--field);
}

svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.action-icon svg { color: var(--cyan); }

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  padding: 12px 18px;
  border: 0;
  border-radius: 14px;
  font: inherit;
  font-weight: 700;
  font-size: 1rem;
  color: var(--text);
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
}

.btn-primary { background: var(--primary); }
.btn-secondary { background: transparent; border: 2px solid var(--cyan); color: var(--cyan); }
.btn[disabled] { opacity: 0.6; cursor: progress; }

@media (hover: hover) {
  .btn-primary:hover { background: var(--primary-hover); }
  .action:hover .action-icon { background: var(--line); }
}

a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
  outline: 3px solid var(--cyan);
  outline-offset: 2px;
}

h2 { margin: 0 0 6px; color: var(--cyan); font-size: 1.35rem; }
.lead { margin: 0 0 16px; color: var(--muted); font-size: 0.95rem; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { margin-bottom: 14px; min-width: 0; }

label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; }
.opt { color: var(--muted); font-weight: 400; }

input[type="text"], input[type="tel"], input[type="email"], select {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border: 2px solid var(--line);
  border-radius: 14px;
  background: var(--field);
  color: var(--text);
  /* 16px minimum : en dessous, iOS zoome la page au focus. */
  font: inherit;
  font-size: 16px;
}

input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); }

.consent {
  display: grid;
  grid-template-columns: 24px 1fr;
  gap: 12px;
  align-items: start;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--field);
}

.consent input { width: 24px; height: 24px; margin: 0; accent-color: var(--primary); }
.consent label { margin: 0; font-size: 0.82rem; font-weight: 400; }

.legal { margin: 12px 0 16px; color: var(--muted); font-size: 0.75rem; }
.legal a { color: var(--muted); }

.error { margin: 6px 0 0; color: var(--danger); font-size: 0.82rem; }
.error:empty { display: none; }
.form-error { margin: 0 0 12px; font-size: 0.9rem; }

/* Champ piège anti-robot : hors écran mais pas display:none (certains robots l'ignorent alors). */
.trap { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

.success { text-align: center; padding: 8px 0; }
.success:focus { outline: none; }
.success h2 { color: var(--ok); }
.success p { color: var(--muted); }
.check { width: 64px; height: 64px; color: var(--ok); margin-bottom: 8px; }
.success .btn { margin-top: 12px; }
.success .legal { margin: 10px 0 0; }

[hidden] { display: none !important; }

@media (prefers-reduced-motion: no-preference) {
  .btn { transition: background-color 0.15s ease; }
  .btn:active { transform: scale(0.98); }
}

@media (max-width: 360px) {
  .row { grid-template-columns: 1fr; }
}
</style>
